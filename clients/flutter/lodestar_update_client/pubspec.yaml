name: lodestar_update_client
description: Flutter client for Lodestar. Supports signed update checks, manifest verification, package download and Android APK install handoff.
version: 0.2.0
homepage: https://github.com/cubevlmu/lodestar
repository: https://github.com/cubevlmu/lodestar
issue_tracker: https://github.com/cubevlmu/lodestar/issues
topics:
  - update
  - auto-update
  - updater

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.0
  convert: ^3.1.0
  cryptography: ^2.7.0
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.5.0
  shared_preferences: ^2.3.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.cubevlmu.lodestar_update_client
        pluginClass: LodestarUpdateClientPlugin
