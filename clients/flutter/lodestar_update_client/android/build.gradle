group 'com.cubevlmu.lodestar_update_client'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.cubevlmu.lodestar_update_client'
    compileSdk 35

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
