name: Publish clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  # ------------------------------------------------------------------ Flutter
  flutter:
    name: pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve version from tag
        id: version
        run: echo "value=${PACKAGE_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        working-directory: clients/flutter/lodestar_update_client
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.value }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Resolve dependencies
        working-directory: clients/flutter/lodestar_update_client
        run: flutter pub get

      - name: Analyze
        working-directory: clients/flutter/lodestar_update_client
        run: flutter analyze

      - name: Test
        working-directory: clients/flutter/lodestar_update_client
        run: dart test

      - name: Check credentials
        id: guard
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -n "$PUB_CREDENTIALS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PUB_CREDENTIALS is not set, skipping pub.dev publish"
          fi

      - name: Publish to pub.dev
        if: steps.guard.outputs.enabled == 'true'
        working-directory: clients/flutter/lodestar_update_client
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          flutter pub publish --force

  # --------------------------------------------------------------------- C#
  nuget:
    name: NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version from tag
        id: version
        run: echo "value=${PACKAGE_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test clients/csharp/Lodestar.Update.Tests

      - name: Pack
        run: >
          dotnet pack clients/csharp/Lodestar.Update
          -c Release
          -p:Version=${{ steps.version.outputs.value }}
          -o "$RUNNER_TEMP/nuget"

      - name: Check secret
        id: guard
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NUGET_API_KEY is not set, skipping NuGet publish"
          fi

      - name: Publish to NuGet
        if: steps.guard.outputs.enabled == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "$RUNNER_TEMP/nuget/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # -------------------------------------------------------------------- Java
  maven:
    name: Maven (GitHub Packages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ github.workspace }}/.mvn

      - name: Resolve version from tag
        id: version
        run: echo "value=${PACKAGE_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Self test
        working-directory: clients/java
        run: |
          mkdir -p out
          javac --release 17 -d out $(find src -name '*.java')
          java -cp out com.cubevlmu.lodestar.update.SelfTest

      - name: Set project version
        working-directory: clients/java
        run: >
          mvn -B -q versions:set
          -DnewVersion=${{ steps.version.outputs.value }}
          -DgenerateBackupPoms=false

      - name: Deploy
        working-directory: clients/java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B deploy -DskipTests
          -s "${{ github.workspace }}/.mvn/settings.xml"
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
